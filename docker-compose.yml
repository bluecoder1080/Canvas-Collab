# Canvas-Collab services.
# Postgres is the only stateful dependency. Backends run with `pnpm dev`.
#
# Usage:
#   docker compose up -d        # start postgres
#   pnpm --filter @repo/db migrate
#   pnpm dev                    # web :3000, http :3001, ws :8080

services:
  postgres:
    image: postgres:16-alpine
    container_name: canvas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: canvas
    ports:
      - "5432:5432"
    volumes:
      - canvas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canvas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  canvas-pgdata:
